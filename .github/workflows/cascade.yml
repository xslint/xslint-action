---
name: cascade
'on':
  repository_dispatch:
    types: [ xslint-released ]
permissions:
  contents: write
concurrency:
  group: cascade-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cascade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump the pinned xslint to the released version
        id: bump
        timeout-minutes: 15
        env:
          NEW: ${{ github.event.client_payload.version }}
        run: |
          current="$(grep -oP "@maxonfjvipon/xslint@\K[0-9.]+" index.js)"
          if [ "${current}" = "${NEW}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "index.js already pins ${NEW}; nothing to do"
            exit 0
          fi
          sed -E -i "s|@maxonfjvipon/xslint@[0-9.]+|@maxonfjvipon/xslint@${NEW}|" index.js
          echo "waiting for @maxonfjvipon/xslint@${NEW} to propagate to npm"
          streak=0
          for _ in $(seq 1 40); do
            if npm pack --dry-run --prefer-online "@maxonfjvipon/xslint@${NEW}" > /dev/null 2>&1; then
              streak=$((streak + 1))
            else
              streak=0
            fi
            test "${streak}" -ge 3 && break
            sleep 10
          done
          if [ "${streak}" -lt 3 ]; then
            echo "::error::@maxonfjvipon/xslint@${NEW} did not resolve three times in a row in 40 attempts ten seconds apart"
            exit 1
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
      - name: Validate the action against the new xslint
        if: steps.bump.outputs.changed == 'true'
        env:
          npm_config_prefer_online: 'true'
        run: make all
      - name: Compute this action's next patch version
        id: next
        if: steps.bump.outputs.changed == 'true'
        run: |
          git fetch --tags --force
          latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=version:refname | tail -1)"
          next="$(echo "${latest}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')"
          echo "version=${next}" >> "${GITHUB_OUTPUT}"
      - name: Commit the bump and tag the release
        if: steps.bump.outputs.changed == 'true'
        env:
          NEW: ${{ github.event.client_payload.version }}
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "chore: bump @maxonfjvipon/xslint to ${NEW}"
          git push origin HEAD:master
          git tag "${NEXT}"
          git push origin "${NEXT}"
