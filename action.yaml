---
name: 'xslint-action'
description: 'Xslint linter GitHub action'
branding:
  icon: alert-triangle
  color: orange
inputs:
  args:
    description: 'Files and directories to check'
    required: false
  suppress:
    description: 'Checks to suppress'
    required: false
  format:
    description: 'Output format: github (default, inline annotations), text, json, sarif'
    required: false
    default: 'github'
  max-warnings:
    description: 'Warnings to allow before the run fails (-1 allows any number)'
    required: false
  config:
    description: 'Path to a .xslint.yml configuration file'
    required: false
  quiet:
    description: 'Set to true to suppress informational logs'
    required: false
runs:
  using: 'node20'
  main: 'index.js'
